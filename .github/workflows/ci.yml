name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npx tsc -b
      - name: lint
        run: npm run lint
      - name: 単体テスト
        run: npm test
      - name: 単体テスト（UTC。本番の Lambda と同じタイムゾーンで予約ルールを確認）
        run: npm run test:utc
      - name: build
        run: npx vite build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright のブラウザを用意
        run: npx playwright install --with-deps chromium
      - name: E2Eテスト
        run: npm run e2e
      - name: 失敗したときはレポートを残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint
      - name: SAM テンプレートの検証
        run: cfn-lint infra/template.yaml
